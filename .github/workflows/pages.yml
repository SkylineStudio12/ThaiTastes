name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Data layer tests (fake Supabase) and AI layer tests (throwaway Postgres)
        run: npm test
      - name: Migration script tests
        run: cd scripts && npm ci && node --test
      - name: Schema and RLS tests (throwaway Postgres)
        run: bash supabase/tests/run-local.sh

  backend:
    # Applies supabase/migrations and deploys the Edge Function, before the app that depends on them goes live.
    # Without the secrets it does nothing and says so, so the app still deploys.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-backend
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      APP_URL_OVERRIDE: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - id: cfg
        name: Read the settings
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::Supabase not updated. Add the secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_URL and the variable SUPABASE_URL to deploy it from here."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$SUPABASE_DB_URL" in
            *'[YOUR-PASSWORD]'*) echo "::error::SUPABASE_DB_URL still contains [YOUR-PASSWORD]: put the database password in its place"; exit 1;;
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL must be the Session pooler connection string (postgresql://...)"; exit 1;;
          esac
          ref=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]{20})\.supabase\.co/?$#\1#p')
          if [ -z "$ref" ]; then echo "::error::SUPABASE_URL must look like https://<project-ref>.supabase.co"; exit 1; fi
          repo="${GITHUB_REPOSITORY#*/}"
          app="${APP_URL_OVERRIDE:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${repo}/}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"; echo "app=$app" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.cfg.outputs.skip != 'true'
        name: Apply database migrations
        # Straight to the database through the session pooler (GitHub runners have no IPv6, so not db.<ref>.supabase.co).
        # No `supabase link`: scoped access tokens cannot get the project_admin_read permission it needs.
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          echo y | supabase db push --db-url "$SUPABASE_DB_URL"
      - if: steps.cfg.outputs.skip != 'true'
        name: Deploy the AI layer (Edge Function tt)
        env:
          REF: ${{ steps.cfg.outputs.ref }}
          APP: ${{ steps.cfg.outputs.app }}
        run: |
          supabase secrets set "APP_URL=$APP" --project-ref "$REF"
          supabase functions deploy tt --project-ref "$REF" --no-verify-jwt
      - if: steps.cfg.outputs.skip != 'true'
        name: Check that it refuses strangers
        env:
          REF: ${{ steps.cfg.outputs.ref }}
        run: |
          base="https://$REF.supabase.co/functions/v1/tt"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/mcp" -H 'content-type: application/json' -d '{}')
            [ "$code" = 401 ] && break; sleep 10
          done
          [ "$code" = 401 ] || { echo "::error::$base/mcp answered $code, expected 401"; exit 1; }
          curl -sf "$base/.well-known/openid-configuration" >/dev/null || { echo "::error::OAuth metadata not served"; exit 1; }
          echo "AI layer is up at $base/mcp"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, backend]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Write the public config (URL and anon key only)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const { SUPABASE_URL: u, SUPABASE_ANON_KEY: k, GITHUB_SHA: sha } = process.env;
            if (!u || !k) { console.error("Set the repository variables SUPABASE_URL and SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions > Variables)."); process.exit(1); }
            if (/^sb_secret_/.test(k) || /service_role/i.test(Buffer.from(k.split(".")[1] || "", "base64url").toString())) { console.error("That looks like the service-role key. Use the anon key."); process.exit(1); }
            require("fs").writeFileSync("web/js/config.js", `export const SUPABASE_URL = ${JSON.stringify(u)};\nexport const SUPABASE_ANON_KEY = ${JSON.stringify(k)};\nexport const BUILD = ${JSON.stringify(sha.slice(0, 7))};\n`);
          '
          sed -i "s/__BUILD__/${GITHUB_SHA}/" web/sw.js
          node scripts/build-openapi.mjs "$SUPABASE_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
